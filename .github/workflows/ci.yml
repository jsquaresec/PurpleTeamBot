name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q bot core services storage main.py
      - name: Import smoke test
        run: |
          python - <<'PY'
          import bot.client
          import bot.extra_commands
          import core.config
          import services.analyzers
          import services.integrations
          import services.nmap_service
          import services.passive_service
          import services.tls_service
          import storage.db
          print('PurpleTeamBot imports OK')
          PY
