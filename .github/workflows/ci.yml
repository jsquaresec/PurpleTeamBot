name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q bot core services storage main.py
      - name: Import smoke test
        run: |
          python - <<'PY'
          import bot.client
          import bot.daily_snapshot
          import bot.extra_commands
          import bot.provider_commands
          import bot.security_commands
          import core.config
          import services.advanced_osint
          import services.analyzers
          import services.assessment
          import services.integrations
          import services.nmap_service
          import services.passive_service
          import services.reputation
          import services.tls_service
          import storage.db
          print('PurpleTeamBot imports OK')
          PY
      - name: Discord command registration smoke test
        run: |
          python - <<'PY'
          from bot.client import PurpleTeamBot
          from bot.daily_snapshot import register_snapshot_command
          from bot.extra_commands import register_extra_commands
          from bot.provider_commands import register_provider_commands
          from bot.security_commands import register_security_commands

          bot = PurpleTeamBot()
          register_extra_commands(bot)
          register_provider_commands(bot)
          register_security_commands(bot)
          register_snapshot_command(bot)
          bot._register_commands()
          commands = bot.tree.get_commands()
          names = [command.name for command in commands]
          assert len(names) == len(set(names)), f'duplicate top-level commands: {names}'
          assert {'scope', 'scan', 'osint', 'person', 'intel', 'vuln', 'reverse', 'analyze', 'recon', 'reputation', 'passive', 'osintx', 'assess', 'investigate', 'history', 'status', 'snapshot'} <= set(names)
          print(f'PurpleTeamBot command registration OK: {len(names)} top-level commands')
          PY
